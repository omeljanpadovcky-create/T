name: P2P public endpoint probe
on:
  push:
    paths:
      - '.github/workflows/p2p-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Binance BUY
        run: |
          python - <<'PY'
          import requests, json
          for side in ("BUY","SELL"):
              u="https://www.binance.com/bapi/c2c/v1/public/c2c/agent/ad-list"
              r=requests.get(u,params={"fiat":"UAH","asset":"USDT","tradeType":side,"limit":20},timeout=20,headers={"User-Agent":"Mozilla/5.0"})
              print("SIDE",side,"HTTP",r.status_code)
              print(r.text[:12000])
          PY
