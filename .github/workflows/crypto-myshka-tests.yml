name: CryptoMyshka Tests

on:
  push:
    branches: [main]
    paths:
      - 'crypto_myshka/*.py'
      - 'crypto_myshka/tests/**'
      - 'crypto_myshka/db/**'
      - 'crypto_myshka/requirements.txt'
      - '.github/workflows/crypto-myshka-tests.yml'
  pull_request:
    paths:
      - 'crypto_myshka/*.py'
      - 'crypto_myshka/tests/**'
      - 'crypto_myshka/db/**'
      - 'crypto_myshka/requirements.txt'
      - '.github/workflows/crypto-myshka-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myshka
          POSTGRES_PASSWORD: myshka_test
          POSTGRES_DB: myshka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myshka -d myshka_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://myshka:myshka_test@localhost:5432/myshka_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r crypto_myshka/requirements.txt
      - name: Run invariants
        run: python -m unittest discover -s crypto_myshka/tests -p 'test_*.py' -v
