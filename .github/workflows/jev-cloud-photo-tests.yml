name: JEV Cloud Photo API Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/chart-analysis.js'
      - 'api/chart-health.js'
      - 'jev_api/api/chart-analysis.js'
      - 'jev_api/api/chart-health.js'
      - 'jev_api/tests/chart-cloud.test.js'
      - 'vercel.json'
      - 'jev_api/vercel.json'
      - '.github/workflows/jev-cloud-photo-tests.yml'

permissions:
  contents: read

jobs:
  test-cloud-api:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Node server code syntax
        run: |
          node --check jev_api/api/chart-analysis.js
          node --check jev_api/api/chart-health.js
          node --check jev_api/api/jev-chat.js
      - name: Test image parsing, Gemini, APInex and access control (mocked, no paid calls)
        run: node --test jev_api/tests/chart-cloud.test.js
      - name: Verify Vercel Node configuration
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          for (const file of ['vercel.json','jev_api/vercel.json']) {
            const c=JSON.parse(fs.readFileSync(file,'utf8'));
            if (c.framework !== null || !c.functions?.['api/chart-analysis.js']?.maxDuration ||
                c.functions['api/chart-analysis.js'].maxDuration < 30) {
              throw new Error(file + ': invalid JEV Node runtime/time limit');
            }
            console.log(file + ': Other preset, photo timeout ' + c.functions['api/chart-analysis.js'].maxDuration + ' seconds');
          }
          JS
