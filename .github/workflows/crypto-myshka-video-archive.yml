name: CryptoMyshka YouTube Video Archive

on:
  workflow_dispatch:
  schedule:
    # Backfill older video metadata every two hours, not continuous LIVE watching.
    - cron: '17 */2 * * *'
  push:
    branches: [main]
    paths:
      - 'crypto_myshka/youtube_archive.py'
      - 'crypto_myshka/video_jev.py'
      - 'crypto_myshka/jev_gemini_dialogue.py'
      - 'crypto_myshka/video_gemini.py'
      - 'crypto_myshka/tests/test_youtube_archive.py'
      - '.github/workflows/crypto-myshka-video-archive.yml'

permissions:
  contents: write

concurrency:
  group: crypto-myshka-video-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public YouTube metadata dependencies
        run: python -m pip install requests==2.32.5 yt-dlp
      - name: Check Python syntax and archive guarantees
        run: |
          python -m py_compile crypto_myshka/youtube_archive.py crypto_myshka/video_jev.py crypto_myshka/video_gemini.py crypto_myshka/jev_gemini_dialogue.py
          python -m unittest crypto_myshka.tests.test_youtube_archive crypto_myshka.tests.test_jev_video_context -v
      - name: Show Gemini API setup status (no secret values)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning title=Gemini not configured::GEMINI_API_KEY is missing in GitHub Actions Secrets. Video indexing continues, but Gemini cannot analyze videos."
            echo "⚠️ Gemini API is not connected. Add \`GEMINI_API_KEY\` in Actions Secrets to start genuine video analysis." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Gemini API secret is present; attempting budget-limited video analysis."
            echo "✅ Gemini API secret found; actual video results depend on model access and YouTube." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Index public videos and use Gemini to understand actual audio and frames when configured
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_GEMINI_MODEL: 'gemini-3.5-flash-lite'
          YOUTUBE_GEMINI_ENABLED: 'true'
          YOUTUBE_GEMINI_MAX_PER_RUN: '2'
          YOUTUBE_GEMINI_DAILY_SECONDS: '21600'
          APINEX_API_KEY: ${{ secrets.APINEX_API_KEY }}
          YOUTUBE_JEV_MODEL: 'free/deepseek-v4.1-flash'
          YOUTUBE_JEV_ENABLED: 'true'
          YOUTUBE_JEV_MAX_PER_RUN: '2'
          VIDEO_ARCHIVE_PAGE: '45'
          VIDEO_ARCHIVE_RECENT: '12'
          VIDEO_ARCHIVE_DETAILS: '5'
        run: python crypto_myshka/youtube_archive.py
      - name: Gemini and JEV discuss one newly reviewed video (research only)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APINEX_API_KEY: ${{ secrets.APINEX_API_KEY }}
          YOUTUBE_GEMINI_MODEL: 'gemini-2.5-flash'
          YOUTUBE_JEV_MODEL: 'free/deepseek-v4.1-flash'
        run: python crypto_myshka/jev_gemini_dialogue.py
      - name: Print evidence-based video analysis progress
        run: |
          python - <<'PY'
          import json,os
          path="crypto_myshka/data/youtube_archive.json"
          with open(path,encoding="utf-8") as stream:data=json.load(stream)
          found=len(data.get("videos") or [])
          done=data.get("gemini_analyzed_count") or 0
          cap=sum(1 for item in data.get("videos") or [] if item.get("caption_status")=="available")
          lines=[
            "### 🐭 ТрейдМишка · YouTube Analysis",
            f"Відео знайдено: **{found}**",
            f"Відео фактично проаналізовано Gemini: **{done}**",
            f"Із доступними субтитрами: **{cap}**",
            f"Gemini API налаштовано: **{'так' if data.get('gemini_configured') else 'ні'}**",
            "Знайдені відео не вважаються автоматично проаналізованими.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as target:
            target.write("\n".join(lines)+"\n")
          print("ARCHIVE FOUND",found,"GEMINI VIDEO ANALYSES",done)
          PY
      - name: Publish only the separately versioned video archive
        run: |
          git config user.name "CryptoMyshka Video Archive"
          git config user.email "crypto-myshka@users.noreply.github.com"
          cp crypto_myshka/data/youtube_archive.json /tmp/myshka_video_archive.json
          cp crypto_myshka/data/jev_video_knowledge.json /tmp/myshka_jev_video_knowledge.json
          if [ -f crypto_myshka/data/jev_research_dialogues.json ]; then cp crypto_myshka/data/jev_research_dialogues.json /tmp/myshka_jev_dialogues.json; fi
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/myshka_video_archive.json crypto_myshka/data/youtube_archive.json
            cp /tmp/myshka_jev_video_knowledge.json crypto_myshka/data/jev_video_knowledge.json
            if [ -f /tmp/myshka_jev_dialogues.json ]; then cp /tmp/myshka_jev_dialogues.json crypto_myshka/data/jev_research_dialogues.json; fi
            git add crypto_myshka/data/youtube_archive.json crypto_myshka/data/jev_video_knowledge.json
            if [ -f crypto_myshka/data/jev_research_dialogues.json ]; then git add crypto_myshka/data/jev_research_dialogues.json; fi
            if git diff --cached --quiet; then
              echo "No new or enriched videos"
              exit 0
            fi
            git commit -m "Refresh incremental Myshka YouTube video archive"
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
