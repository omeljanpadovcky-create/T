name: CryptoMyshka LIVE Broadcast Monitor

on:
  schedule:
    # Best-effort polling. GitHub schedule may be delayed or dropped at busy times.
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crypto_myshka/live_monitor.py'
      - 'crypto_myshka/pair_reports.py'
      - 'crypto_myshka/pair_jev.py'
      - 'crypto_myshka/tests/test_pair_jev.py'
      - 'crypto_myshka/tests/test_pair_reports.py'
      - 'youtube-analysts.html'
      - '.github/workflows/crypto-myshka-live.yml'

permissions:
  contents: write

concurrency:
  group: crypto-myshka-stream-monitor
  cancel-in-progress: false

jobs:
  monitor-live:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install independent watcher packages
        run: |
          python -m pip install --disable-pip-version-check requests==2.32.5 yt-dlp imageio-ffmpeg
          python -c "import imageio_ffmpeg; print('ffmpeg: ', imageio_ffmpeg.get_ffmpeg_exe())"

      - name: Compile isolated live observer
        run: |
          python -m py_compile crypto_myshka/live_monitor.py crypto_myshka/pair_reports.py crypto_myshka/pair_jev.py
          python -m unittest crypto_myshka.tests.test_pair_reports crypto_myshka.tests.test_pair_jev -v

      - name: Check LIVE channels and inspect temporary frames when available
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LIVE_VISION_MODEL: gpt-4.1-mini
          LIVE_CAPTURE_INTERVAL: '300'
          LIVE_MAX_SNAPSHOTS: '2'
        run: python crypto_myshka/live_monitor.py

      - name: Publish only LIVE snapshot (safe concurrent writers)
        run: |
          git config user.name "CryptoMyshka LIVE Observer"
          git config user.email "crypto-myshka@users.noreply.github.com"
          cp crypto_myshka/data/youtube_live.json /tmp/youtube_live_snapshot.json
          cp crypto_myshka/data/pair_reports.json /tmp/pair_reports_snapshot.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/youtube_live_snapshot.json crypto_myshka/data/youtube_live.json
            cp /tmp/pair_reports_snapshot.json crypto_myshka/data/pair_reports.json
            git add crypto_myshka/data/youtube_live.json crypto_myshka/data/pair_reports.json
            if git diff --cached --quiet; then
              echo "No LIVE/pair changes"
              exit 0
            fi
            git commit -m "Update separate CryptoMyshka LIVE status"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
