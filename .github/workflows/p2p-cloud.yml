name: MYSHKA P2P Cloud 24x7

on:
  schedule:
    # GitHub scheduler starts jobs every 5 min; the job itself scans/publishes every 30 sec.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'p2p_radar/**'
      - 'index.html'
      - 'START_P2P_RADAR.*'
      - '.github/workflows/p2p-cloud.yml'

permissions:
  contents: write

concurrency:
  group: myshka-p2p-cloud
  cancel-in-progress: true

jobs:
  cloud-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      P2P_FIAT: UAH
      P2P_ASSET: USDT
      P2P_CAPITAL_FIAT: '4500'
      P2P_SCAN_SECONDS: '15'
      P2P_MIN_NET_PCT: '0.35'
      P2P_MAX_RISK: '60'
      P2P_MIN_COMPLETION: '90'
      P2P_MIN_ORDERS: '10'
      P2P_TRANSFER_FEE_USDT: '1.0'
      P2P_SAFETY_BUFFER_PCT: '0.15'
      P2P_BINANCE_ENABLED: '1'
      P2P_BYBIT_ENABLED: '1'
      P2P_BANK_WARN_TRANSFERS_PER_DAY: '4'
      P2P_BANK_MAX_TRANSFERS_PER_DAY: '6'
      P2P_BANK_TRANSFERS_PER_CYCLE: '2'
      P2P_BANK_MIN_MINUTES_BETWEEN_CYCLES: '60'
      P2P_BANK_MAX_ALERTS_PER_DAY: '8'
      P2P_TELEGRAM_CONFIRM_WARN: '5'
      P2P_DASHBOARD_URL: 'https://omeljanpadovcky-create.github.io/T/'
      P2P_GIT_PUSH: '0'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TG_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TG_CHAT_ID }}
      BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
      BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
      BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
      BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
      BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE }}
      GATE_API_KEY: ${{ secrets.GATE_API_KEY }}
      GATE_API_SECRET: ${{ secrets.GATE_API_SECRET }}
      OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
      OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
      OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
      KUCOIN_API_KEY: ${{ secrets.KUCOIN_API_KEY }}
      KUCOIN_API_SECRET: ${{ secrets.KUCOIN_API_SECRET }}
      KUCOIN_API_PASSPHRASE: ${{ secrets.KUCOIN_API_PASSPHRASE }}
      MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
      MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
      HTX_API_KEY: ${{ secrets.HTX_API_KEY }}
      HTX_API_SECRET: ${{ secrets.HTX_API_SECRET }}
      BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
      BINGX_API_SECRET: ${{ secrets.BINGX_API_SECRET }}
      COINEX_API_KEY: ${{ secrets.COINEX_API_KEY }}
      COINEX_API_SECRET: ${{ secrets.COINEX_API_SECRET }}
      WHITEBIT_API_KEY: ${{ secrets.WHITEBIT_API_KEY }}
      WHITEBIT_API_SECRET: ${{ secrets.WHITEBIT_API_SECRET }}
      LBANK_API_KEY: ${{ secrets.LBANK_API_KEY }}
      LBANK_API_SECRET: ${{ secrets.LBANK_API_SECRET }}
      COINW_API_KEY: ${{ secrets.COINW_API_KEY }}
      COINW_API_SECRET: ${{ secrets.COINW_API_SECRET }}
      TOOBIT_API_KEY: ${{ secrets.TOOBIT_API_KEY }}
      TOOBIT_API_SECRET: ${{ secrets.TOOBIT_API_SECRET }}
      BITUNIX_API_KEY: ${{ secrets.BITUNIX_API_KEY }}
      BITUNIX_API_SECRET: ${{ secrets.BITUNIX_API_SECRET }}
      WEEX_API_KEY: ${{ secrets.WEEX_API_KEY }}
      WEEX_API_SECRET: ${{ secrets.WEEX_API_SECRET }}
      DIGIFINEX_API_KEY: ${{ secrets.DIGIFINEX_API_KEY }}
      DIGIFINEX_API_SECRET: ${{ secrets.DIGIFINEX_API_SECRET }}
      BITMART_API_KEY: ${{ secrets.BITMART_API_KEY }}
      BITMART_API_SECRET: ${{ secrets.BITMART_API_SECRET }}

    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: app
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scanner
        run: pip install -r app/p2p_radar/requirements.txt

      - name: Prepare persistent live-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p live
          cd live
          git init -q
          git config user.name "MYSHKA P2P Cloud"
          git config user.email "myshka-p2p@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads origin live-data >/dev/null 2>&1; then
            git fetch -q --depth=1 origin live-data
            git checkout -q -B live-data FETCH_HEAD
          else
            git checkout -q --orphan live-data
            printf "MYSHKA live data branch\n" > .live-data
            printf "{}\n" > latest.json
            git add .
            git commit -q -m "MYSHKA live data"
            git push -q --force origin HEAD:live-data
          fi

          # If an old non-dedicated live-data branch exists, reset it to a tiny orphan branch.
          if [ ! -f .live-data ]; then
            git checkout -q --orphan live-data-clean
            git rm -rf . >/dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            printf "MYSHKA live data branch\n" > .live-data
            printf "{}\n" > latest.json
            git add .
            git commit -q -m "MYSHKA live data"
            git branch -M live-data
            git push -q --force origin HEAD:live-data
          fi
          cd ..

          mkdir -p app/p2p_radar/reports
          for f in state.json bank_guard.json history.csv; do
            if [ -f "live/$f" ]; then cp "live/$f" "app/p2p_radar/$f"; fi
          done
          if [ -d live/reports ]; then cp -a live/reports/. app/p2p_radar/reports/ || true; fi

      - name: Run cloud radar and publish every 15 seconds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          publish_live() {
            if [ ! -s app/p2p_radar/latest.json ]; then return 0; fi

            cp app/p2p_radar/latest.json live/latest.json
            [ -f app/p2p_radar/state.json ] && cp app/p2p_radar/state.json live/state.json || true
            [ -f app/p2p_radar/bank_guard.json ] && cp app/p2p_radar/bank_guard.json live/bank_guard.json || true

            if [ -f app/p2p_radar/history.csv ]; then
              { head -n 1 app/p2p_radar/history.csv; tail -n 4999 app/p2p_radar/history.csv | tail -n +2; } > live/history.csv.tmp || true
              mv live/history.csv.tmp live/history.csv
            fi

            mkdir -p live/reports
            find live/reports -type f -name '*.md' -delete || true
            find app/p2p_radar/reports -maxdepth 1 -type f -name '*.md' -mtime -2 -exec cp {} live/reports/ \; || true

            date -u +"%Y-%m-%dT%H:%M:%SZ" > live/heartbeat.txt
            printf '{"source":"github-actions","scan_seconds":15,"updated_at":"%s","run_id":"%s"}\n' "$(cat live/heartbeat.txt)" "${GITHUB_RUN_ID}" > live/cloud.json

            pushd live >/dev/null
            git add -A
            if ! git diff --cached --quiet; then
              if git rev-parse --verify HEAD >/dev/null 2>&1; then
                git commit -q --amend --no-edit
              else
                git commit -q -m "MYSHKA live data"
              fi
              git push -q --force origin HEAD:live-data
            fi
            popd >/dev/null
          }

          python -u app/p2p_radar/radar.py > radar.log 2>&1 &
          RADAR_PID=$!

          # Keep this runner alive long enough that the next 5-minute scheduled run
          # is normally already queued. That removes dependency on the user's PC.
          END=$((SECONDS+270))
          while [ "$SECONDS" -lt "$END" ]; do
            sleep 15
            publish_live || true
            if ! kill -0 "$RADAR_PID" 2>/dev/null; then
              echo "Radar exited; restarting"
              python -u app/p2p_radar/radar.py >> radar.log 2>&1 &
              RADAR_PID=$!
            fi
          done

          publish_live || true
          kill -INT "$RADAR_PID" 2>/dev/null || true
          wait "$RADAR_PID" 2>/dev/null || true

      - name: Scanner log
        if: always()
        run: tail -n 100 radar.log || true
