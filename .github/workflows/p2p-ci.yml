name: P2P Radar CI

on:
  push:
    paths:
      - 'p2p_radar/**'
      - 'START_P2P_RADAR.*'
      - 'P2P_*.bat'
      - 'INSTALL_P2P_AUTOSTART.*'
      - 'index.html'
      - '.github/workflows/p2p-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile p2p_radar/radar.py p2p_radar/bank_guard.py
      - name: Install runtime dependencies
        run: pip install -r p2p_radar/requirements.txt
      - name: Import smoke test
        run: python -c "import importlib.util; s=importlib.util.spec_from_file_location('radar','p2p_radar/radar.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); print('P2P radar import OK')"
