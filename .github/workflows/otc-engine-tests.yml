name: Crypto Myshka OTC engine tests
on:
  push:
    branches: [main]
    paths:
      - 'crypto_myshka/**'
      - '.github/workflows/otc-engine-tests.yml'
  pull_request:
    paths:
      - 'crypto_myshka/**'
      - '.github/workflows/otc-engine-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check OTC modules
        run: python -m py_compile crypto_myshka/otc_signal_engine.py crypto_myshka/otc_telegram_handlers.py
      - name: Run engine unit tests
        run: python -m unittest crypto_myshka.test_otc_signal_engine -v
