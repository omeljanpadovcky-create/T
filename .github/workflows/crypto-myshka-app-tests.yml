name: Crypto Myshka Photo Assistant Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'myshka-app.html'
      - 'app/photo-scan.js'
      - 'app/photo-scan.analytics.test.cjs'
      - 'app/simple-photo-assistant.js'
      - 'app/simple-photo-assistant.smoke.cjs'
      - 'myshka-sw.js'
      - '.github/workflows/crypto-myshka-app-tests.yml'

permissions:
  contents: read

jobs:
  photo-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app/photo-scan.js
          node --check app/photo-scan.analytics.test.cjs
          node --check app/simple-photo-assistant.js
          node --check app/simple-photo-assistant.smoke.cjs
          node --check myshka-sw.js
      - name: Check simple interface
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scan(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=set()
              def handle_starttag(self, tag, attrs):
                  self.ids.update(value for key,value in attrs if key=='id' and value)
          html=Path('myshka-app.html').read_text()
          s=Scan()
          s.feed(html)
          ids={'file-input','chart-canvas','canvas-area','result','result-stats','result-title'}
          assert ids<=s.ids, ids-s.ids
          for obsolete in ('ticket-buy','ticket-sell','cloud-access','run-pocket-ai'):
              assert obsolete not in s.ids
          assert 'app/simple-photo-assistant.js' in html
          print('One page, one scanner, no trade dashboard')
          PY
      - name: Test chart data analytics
        run: node app/photo-scan.analytics.test.cjs
      - name: Install browser DOM test dependency
        run: npm install --no-save --ignore-scripts jsdom@26.1.0
      - name: Test screenshot assistant
        run: node app/simple-photo-assistant.smoke.cjs
