name: Crypto Myshka BTC Paper
on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/btc_paper.py'
      - '.github/workflows/btc-paper.yml'
permissions:
  contents: write
concurrency:
  group: myshka-btc-paper
  cancel-in-progress: false
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run public-market paper simulation
        run: python3 scripts/btc_paper.py
      - name: Commit journal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/btc-paper.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update BTC paper demo [skip ci]"
            git push
          fi
      - name: Validate market data status
        run: |
          python3 -c "import json,sys; s=json.load(open('data/btc-paper.json')); print('Market status:',s.get('status'),s.get('error','')); sys.exit(0 if s.get('status')=='ok' else 1)"
