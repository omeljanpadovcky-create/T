name: Check Crypto Myshka APInex Connection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/myshka-apinex-connection-test.yml'

permissions:
  contents: read

jobs:
  apinex-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify secret and test a short free-category JEV completion
        env:
          APINEX_API_KEY: ${{ secrets.APINEX_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          key = os.environ.get('APINEX_API_KEY', '').strip()
          if not key:
              raise SystemExit('ERROR: APINEX_API_KEY is missing from GitHub Actions secrets.')
          print('GitHub secret exists and is masked. Checking the same API used by JEV.')
          payload = json.dumps({
              'model': 'free/deepseek-v4.1-flash',
              'stream': False, 'max_tokens': 16,
              'messages': [
                  {'role':'system','content':'Reply with only OK.'},
                  {'role':'user','content':'Connection test.'}
              ]
          }).encode('utf-8')
          req = urllib.request.Request(
              'https://api.apinex.bond/v1/chat/completions',
              headers={
                  'Authorization': 'Bearer ' + key,
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                  'User-Agent': 'CryptoMyshka-JEV/1.0'
              },
              data=payload, method='POST'
          )
          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  data = json.load(response)
              choices = data.get('choices') if isinstance(data,dict) else None
              if not choices:
                  raise SystemExit('APInex returned HTTP 200 but no standard chat response.')
              print('SUCCESS: APInex chat/completions works for JEV in GitHub Actions.')
              print('Model: free/deepseek-v4.1-flash; test contained no screenshots or trading data.')
          except urllib.error.HTTPError as e:
              # Do not print the original request or raw response, which may contain sensitive fields.
              code=e.code
              if code==429:
                  raise SystemExit('APInex limit reached (HTTP 429); secret is present, retry later.')
              raise SystemExit('APInex chat API refused the request (HTTP '+str(code)+').')
          except (TimeoutError, urllib.error.URLError) as e:
              raise SystemExit('APInex connection failed: '+type(e).__name__)
          PY
