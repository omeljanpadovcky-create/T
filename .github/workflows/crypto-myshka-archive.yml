name: CryptoMyshka Telegram Archive

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-myshka-telegram-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        run: pip install -r crypto_myshka/requirements.txt

      - name: Crawl Telegram archive
        run: python crypto_myshka/telegram_archive.py

      - name: Rebuild feed archive status
        run: python crypto_myshka/collector.py

      - name: Commit archive
        run: |
          git config user.name "CryptoMyshka Bot"
          git config user.email "crypto-myshka@users.noreply.github.com"
          git add crypto_myshka/data/telegram_archive.json crypto_myshka/data/feed.json
          if git diff --cached --quiet; then
            echo "No archive changes"
            exit 0
          fi
          git commit -m "Update CryptoMyshka Telegram archive"
          git pull --rebase origin main
          git push origin HEAD:main
