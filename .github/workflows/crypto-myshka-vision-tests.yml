name: Crypto Myshka Local Vision Tests
on:
  push:
    paths:
      - 'crypto_myshka/local_chart_server.py'
      - 'crypto_myshka/tests/test_local_chart_server.py'
      - '.github/workflows/crypto-myshka-vision-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vision-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify local chart endpoint with mocked Ollama
        run: python -m unittest crypto_myshka.tests.test_local_chart_server -v
