name: Bybit Master Research (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
concurrency:
  group: bybit-master-research
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect authorized feed (no orders)
        env:
          BYBIT_MASTER_FEED_URL: ${{ secrets.BYBIT_MASTER_FEED_URL }}
          BYBIT_MASTER_FEED_HOST: ${{ vars.BYBIT_MASTER_FEED_HOST }}
        run: python crypto_myshka/bybit_master_collector.py
      - name: Commit sanitized public research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto_myshka/data/bybit_master_research.json
          if ! git diff --cached --quiet; then
            git commit -m "Update authorized Bybit master research snapshot"
            git push
          fi
