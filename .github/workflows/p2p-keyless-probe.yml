name: P2P keyless feeds probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/p2p-keyless-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe public P2P feeds
        run: |
          python - <<'PY'
          import requests,re,json
          S=requests.Session();S.headers['User-Agent']='Mozilla/5.0'
          tests=[
            ("kucoin-get","GET","https://www.kucoin.com/_api/otc/ad/list",{"status":"PUTUP","currency":"USDT","legal":"UAH","page":"1","pageSize":"10","side":"SELL"}),
            ("kucoin-post","POST","https://www.kucoin.com/_api/otc/ad/list",{"currency":"USDT","legal":"UAH","page":1,"pageSize":10,"side":"SELL","status":"PUTUP"}),
            ("htx-new","GET","https://otc-api.trygofast.com/v1/data/trade-market",{"coinId":"usdt","currency":"uah","tradeType":"sell","currPage":"1","payMethod":"0","acceptOrder":"0","country":"","blockType":"general","online":"1","range":"0","amount":""}),
            ("htx-web","GET","https://www.htx.com/-/x/otc/v1/data/trade-market",{"coinId":"2","currency":"uah","tradeType":"sell","currPage":"1","payMethod":"0","acceptOrder":"0","country":"","blockType":"general","online":"1","range":"0","amount":""}),
            ("bingx-page","GET","https://fiat.bingx.com/en/p2p",{}),
            ("lbank-page","GET","https://www.lbank.com/uk/crypto/buy",{}),
            ("coinw-page","GET","https://www.coinw.com/en_XA/p2p-trading/personalized/buy",{}),
            ("toobit-page","GET","https://www.toobit.com/en-US/p2p",{}),
            ("bitunix-page","GET","https://www.bitunix.com/p2p/p2p-trade",{}),
            ("weex-page","GET","https://www.weex.com/buy-crypto/trading",{}),
            ("whitebit-page","GET","https://whitebit.com/ua/m/p-2-p-express",{}),
            ("bitmart-page","GET","https://www.bitmart.com/uk-UA/p2p/",{})
          ]
          for name,method,url,p in tests:
            print("\n===== "+name+" =====")
            try:
              if method=="GET": r=S.get(url,params=p,timeout=20,allow_redirects=True)
              else: r=S.post(url,json=p,timeout=20,allow_redirects=True)
              print("HTTP",r.status_code,"URL",r.url,"TYPE",r.headers.get("content-type"),"LEN",len(r.text))
              t=r.text
              if "application/json" in (r.headers.get("content-type") or ""):
                print(t[:5000])
              else:
                low=t.lower()
                for needle in ["uah","usdt","price","merchant","advert"]:
                  i=low.find(needle)
                  if i>=0: print("CTX",needle,repr(t[max(0,i-250):i+800]))
                prices=re.findall(r'(?<!\d)(?:4[0-9]|5[0-9])(?:[.,]\d{1,4})?(?!\d)',t)
                print("PRICE_TOKENS",prices[:30])
            except Exception as e:
              print("ERR",type(e).__name__,e)
          PY
