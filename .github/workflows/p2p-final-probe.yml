name: P2P final keyless probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/p2p-final-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - name: Probe BingX WEEX Bitunix
        run: |
          python - <<'PY'
          import requests,re,json
          S=requests.Session();S.headers['User-Agent']='Mozilla/5.0'

          print('=== BINGX BUY/SELL ===')
          for typ in [1,2]:
            u='https://api-app.qq-os.com/api/c2c/v3/advert/list'
            body={'type':typ,'fiat':'UAH','asset':'USDT','pageSize':10,'paymentMethodIds':[],'paymentTimeLimits':[],'sortType':0,'amount':'','pageId':1,'advertFilter':{'matchUserCondition':0,'noPaymentMethodVerification':0,'tradedWithMerchantOnly':0,'verifiedMerchantOnly':0}}
            r=S.post(u,json=body,headers={'Origin':'https://fiat.bingx.com','Referer':'https://fiat.bingx.com/'},timeout=20)
            print('TYPE',typ,'HTTP',r.status_code,'LEN',len(r.content));print(r.text[:18000])

          print('=== WEEX BUY/SELL ===')
          for typ in ['SELL','BUY']:
            u='https://otc-gateway.weex.com/api/market'
            p={'allowTrade':'false','amount':'','blockTrade':'false','coinId':'2','countryCode':'','currency':'UAH','follow':'false','haveTrade':'false','page':'1','payMethod':'','tradeType':typ}
            r=S.get(u,params=p,headers={'Referer':'https://www.weex.com/'},timeout=20)
            print('TYPE',typ,'HTTP',r.status_code,'LEN',len(r.content));print(r.text[:18000])

          print('=== BITUNIX JS ENDPOINTS ===')
          urls=[
            'https://www.bitunix.com/web/bitunix-assets/funds/p2p-Cgo4Fz-3.js',
            'https://www.bitunix.com/web/bitunix-assets/funds/p2p-CiyDbteo.js',
            'https://www.bitunix.com/web/bitunix-assets/funds/p2pProvider-5U3LlyyT.js'
          ]
          for u in urls:
            r=S.get(u,timeout=20);print('JS',u,r.status_code,len(r.text))
            for m in sorted(set(re.findall(r'["\']([^"\']{0,180}(?:/web/p2p/|p2p/api|/p2p/)[^"\']{0,180})["\']',r.text,re.I))):
              print('EP',m)
          PY
