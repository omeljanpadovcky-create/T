name: JEV Laya Data + Research Baseline
on:
  schedule:
    # Once daily: GitHub Actions cron is best effort and not a continuous 24/7 daemon.
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      finetune_laya:
        description: 'Run optional CPU Laya head fine-tune (long/experimental)'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/jev_laya_learning.py'
      - '.github/workflows/jev-laya-research.yml'
permissions:
  contents: write
concurrency:
  group: jev-laya-research
  cancel-in-progress: false
jobs:
  labeled-market-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate training pipeline and anti-lookahead guard
        run: |
          python -m py_compile scripts/jev_laya_learning.py
          python scripts/jev_laya_learning.py --self-test
      - name: Fetch public Kraken candles and train BASELINE on past-only features
        run: python scripts/jev_laya_learning.py
      - name: Upload datasets for separate Laya fine-tuning
        uses: actions/upload-artifact@v4
        with:
          name: jev-laya-labeled-csv
          path: build/jev-laya/*.csv
          retention-days: 30
      - name: Research summary (NOT real trading results)
        run: |
          python - <<'PY'
          import json,os
          j=json.load(open('data/jev-laya-research.json'))
          h=j['chronological_purged_holdout']
          summary=['### JEV Laya labeled dataset / logistic baseline',
            'Source: Kraken public spot 5m, never Pocket Option OTC.',
            'Actual Laya checkpoint trained: NO (optional separate manual job).',
            'Holdout examples: '+str(h['examples']),
            'Holdout BUY/SELL predictions: '+str(h['predicted_trades']),
            'Wins / losses / ties: '+str(h['wins'])+' / '+str(h['losses'])+' / '+str(h['ties']),
            'Wilson lower bound: '+str(h['win_rate_wilson_lower_95pct']),
            'Research-only evidence gate passed: '+str(j['research_quality_gate_passed']),
            'This does NOT approve real orders or establish a tradable edge.']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'.join(summary)+'\n')
          PY
      - name: Commit ONLY source-labeled research data with conflict retry
        run: |
          git config user.name "JEV Paper Research"
          git config user.email "crypto-myshka@users.noreply.github.com"
          mkdir -p /tmp/laya-outputs
          cp data/jev-laya-history.json data/jev-laya-research.json data/jev-laya-baseline-model.json /tmp/laya-outputs/
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/laya-outputs/jev-laya-*.json data/
            git add data/jev-laya-history.json data/jev-laya-research.json data/jev-laya-baseline-model.json
            if git diff --cached --quiet; then
              echo "No updated research data"
              exit 0
            fi
            git commit -m "chore: daily Kraken Laya research dataset and baseline [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          echo "Research snapshot not published due to concurrent pushes"
          exit 1

  # This is ACTUAL Laya training, separate from the inexpensive baseline.
  # It is manual due model download and CPU training cost; artifact is NOT auto-deployed.
  finetune-laya-checkpoint:
    if: (github.event_name == 'workflow_dispatch' && inputs.finetune_laya) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[laya-train-once]'))
    needs: labeled-market-learning
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: jev-laya-labeled-csv
          path: build/jev-laya
      - name: Install upstream Laya (not a custom pretend checkpoint)
        run: python -m pip install "laya==0.3.27"
      - name: Laya supervised training; evaluate on chronological holdout
        run: |
          laya-train --data build/jev-laya/train.csv \
            --text-column state --label-column direction \
            --instructions "Classify the next 5-minute Kraken close from historical indicators only." \
            --base english --out build/jev-laya/checkpoint \
            --device cpu --freeze-encoder --epochs 1 \
            --micro-batch 4 --grad-accum 8 \
            --eval-data build/jev-laya/test.csv
      - name: Save trained Laya weights for review, NOT trading
        uses: actions/upload-artifact@v4
        with:
          name: jev-laya-unverified-checkpoint
          path: build/jev-laya/checkpoint/
          retention-days: 14
