name: ТРЕЙДМИШКА — Telegram actions

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "jobs/callbacks.py"
      - "jobs/editing.json"
      - "jobs/statuses.json"
      - ".github/workflows/myshka-callbacks.yml"

concurrency:
  group: trade-myshka-all-workflows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  callbacks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r jobs/requirements.txt
      - name: Process Telegram buttons
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MYSHKA_CANDIDATE_NAME: ${{ secrets.MYSHKA_CANDIDATE_NAME }}
          MYSHKA_PORTFOLIO_URL: ${{ secrets.MYSHKA_PORTFOLIO_URL }}
          MYSHKA_CV_URL: ${{ secrets.MYSHKA_CV_URL }}
          MYSHKA_CONTACT_EMAIL: ${{ secrets.MYSHKA_CONTACT_EMAIL }}
          MYSHKA_SALARY_EXPECTATION: ${{ secrets.MYSHKA_SALARY_EXPECTATION }}
        run: python jobs/callbacks.py
      - name: Save application statuses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs/statuses.json jobs/update_offset.json jobs/editing.json
          git diff --cached --quiet || git commit -m "Update TradeMyshka application statuses"
          git pull --rebase origin main
          git push
