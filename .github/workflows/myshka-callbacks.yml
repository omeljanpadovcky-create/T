name: ТРЕЙДМИШКА — Telegram webhook actions

on:
  repository_dispatch:
    types: [telegram_update]

concurrency:
  group: myshka-job-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  callbacks:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'telegram_update'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r jobs/requirements.txt
      - name: Process Telegram update
        working-directory: jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MYSHKA_CANDIDATE_NAME: ${{ secrets.MYSHKA_CANDIDATE_NAME }}
          MYSHKA_PORTFOLIO_URL: ${{ secrets.MYSHKA_PORTFOLIO_URL }}
          MYSHKA_PORTFOLIO_3D_URL: ${{ secrets.MYSHKA_PORTFOLIO_3D_URL }}
          MYSHKA_PORTFOLIO_GAME_ART_URL: ${{ secrets.MYSHKA_PORTFOLIO_GAME_ART_URL }}
          MYSHKA_PORTFOLIO_DESIGN_URL: ${{ secrets.MYSHKA_PORTFOLIO_DESIGN_URL }}
          MYSHKA_PORTFOLIO_ILLUSTRATION_URL: ${{ secrets.MYSHKA_PORTFOLIO_ILLUSTRATION_URL }}
          MYSHKA_CV_URL: ${{ secrets.MYSHKA_CV_URL }}
          MYSHKA_CONTACT_EMAIL: ${{ secrets.MYSHKA_CONTACT_EMAIL }}
          MYSHKA_PHONE: ${{ secrets.MYSHKA_PHONE }}
          MYSHKA_SALARY_EXPECTATION: ${{ secrets.MYSHKA_SALARY_EXPECTATION }}
          MYSHKA_TELEGRAM_UPDATE_JSON: ${{ toJson(github.event.client_payload.update) }}
          MYSHKA_SKIP_CALLBACK_ACK: "1"
        run: python process_telegram_update.py
      - name: Persist Telegram action state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs/statuses.json jobs/editing.json jobs/processed_telegram_updates.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist MYSHKA Telegram webhook action state"
            git push origin HEAD:main
          fi
