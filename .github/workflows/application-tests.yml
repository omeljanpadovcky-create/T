name: MYSHKA JOB RADAR — application tests

on:
  push:
    branches:
      - "**"
    paths:
      - "jobs/**"
      - "job-radar/**"
      - ".github/workflows/application-tests.yml"
      - ".github/workflows/myshka-job-radar.yml"
      - ".github/workflows/myshka-callbacks.yml"
  pull_request:
    paths:
      - "jobs/**"
      - ".github/workflows/application-tests.yml"
      - ".github/workflows/myshka-job-radar.yml"
      - ".github/workflows/myshka-callbacks.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r jobs/requirements.txt
      - name: Compile Python files
        run: python -m compileall -q jobs
      - name: Run unit tests
        run: python -m unittest discover -s jobs -p 'test_*.py' -v
      - name: Validate dashboard API JavaScript
        run: node --check job-radar/api/applications.js && node --check job-radar/api/check.js && node --check job-radar/api/health.js && node --check job-radar/api/telegram-setup.js
