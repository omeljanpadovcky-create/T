name: CryptoMyshka 2.0 Feed

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crypto_myshka/**'
      - '.github/workflows/crypto-myshka.yml'

permissions:
  contents: write

concurrency:
  group: crypto-myshka-feed
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install -r crypto_myshka/requirements.txt
      - name: Build CryptoMyshka feed
        run: python crypto_myshka/collector.py
      - name: Commit refreshed feed
        run: |
          git config user.name "CryptoMyshka Bot"
          git config user.email "crypto-myshka@users.noreply.github.com"
          git add crypto_myshka/data/feed.json
          if git diff --cached --quiet; then
            echo "No feed changes"
            exit 0
          fi
          git commit -m "Update CryptoMyshka feed"
          git pull --rebase origin main
          git push origin HEAD:main
