name: CryptoMyshka 2.1 Live + JEV

on:
  schedule:
    # Stagger off :00/:10/:20 where GitHub Actions cron is most congested.
    # Still exactly every 10 minutes: :03, :13, :23, :33, :43, :53 UTC.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crypto_myshka/*.py'
      - 'crypto_myshka/requirements.txt'
      - '.github/workflows/crypto-myshka.yml'

permissions:
  contents: write

concurrency:
  group: crypto-myshka-live
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        run: pip install -r crypto_myshka/requirements.txt

      - name: Run invariant tests
        run: python -m unittest discover -s crypto_myshka/tests -p 'test_*.py' -v

      - name: Build cross-source crypto events
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python crypto_myshka/news_engine.py

      - name: Expand Telegram archive
        env:
          TELEGRAM_ARCHIVE_PAGES: 80
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python crypto_myshka/telegram_archive.py

      - name: Build CryptoMyshka live feed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python crypto_myshka/collector.py

      - name: Telegram connection preflight
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_TEST_ONLY: '1'
        run: python crypto_myshka/notifier.py

      - name: Run JEV language-model analysis
        env:
          APINEX_API_KEY: ${{ secrets.APINEX_API_KEY }}
          JEV_MODEL: free/gpt-5.6-luna
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JEV_API_URL: ${{ secrets.JEV_API_URL }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          JEV_GENERIC_MODEL: ${{ secrets.JEV_GENERIC_MODEL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python crypto_myshka/jev_analyzer.py

      - name: Send Telegram digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python crypto_myshka/notifier.py

      - name: Commit refreshed live data
        run: |
          git config user.name "CryptoMyshka Bot"
          git config user.email "crypto-myshka@users.noreply.github.com"
          git add crypto_myshka/data/feed.json crypto_myshka/data/news.json crypto_myshka/data/notify_state.json crypto_myshka/data/telegram_archive.json
          if git diff --cached --quiet; then
            echo "No live data changes"
            exit 0
          fi
          mkdir -p /tmp/crypto_myshka_data
          cp crypto_myshka/data/feed.json /tmp/crypto_myshka_data/feed.json
          cp crypto_myshka/data/news.json /tmp/crypto_myshka_data/news.json
          cp crypto_myshka/data/notify_state.json /tmp/crypto_myshka_data/notify_state.json
          cp crypto_myshka/data/telegram_archive.json /tmp/crypto_myshka_data/telegram_archive.json
          git reset --hard
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/crypto_myshka_data/feed.json crypto_myshka/data/feed.json
          cp /tmp/crypto_myshka_data/news.json crypto_myshka/data/news.json
          cp /tmp/crypto_myshka_data/notify_state.json crypto_myshka/data/notify_state.json
          cp /tmp/crypto_myshka_data/telegram_archive.json crypto_myshka/data/telegram_archive.json
          git add crypto_myshka/data/feed.json crypto_myshka/data/news.json crypto_myshka/data/notify_state.json crypto_myshka/data/telegram_archive.json
          git commit -m "Update CryptoMyshka live JEV data"
          git push origin HEAD:main
