name: CryptoMyshka 2.1 Live + JEV

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crypto_myshka/*.py'
      - 'crypto_myshka/requirements.txt'
      - '.github/workflows/crypto-myshka.yml'

permissions:
  contents: write
  models: read

concurrency:
  group: crypto-myshka-live
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        run: pip install -r crypto_myshka/requirements.txt

      - name: Build cross-source crypto events
        run: python crypto_myshka/news_engine.py

      - name: Build CryptoMyshka live feed
        run: python crypto_myshka/collector.py

      - name: Run JEV language-model analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JEV_MODEL: openai/gpt-4.1
        run: python crypto_myshka/jev_analyzer.py

      - name: Send Telegram digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto_myshka/notifier.py

      - name: Commit refreshed live data
        run: |
          git config user.name "CryptoMyshka Bot"
          git config user.email "crypto-myshka@users.noreply.github.com"
          git add crypto_myshka/data/feed.json crypto_myshka/data/news.json crypto_myshka/data/notify_state.json
          if git diff --cached --quiet; then
            echo "No live data changes"
            exit 0
          fi
          git commit -m "Update CryptoMyshka live JEV data"
          git pull --rebase origin main
          git push origin HEAD:main
