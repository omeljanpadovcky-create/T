name: MYSHKA JOB RADAR

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/myshka-job-radar.yml"
  schedule:
    # Check once per hour; Python applies Europe/Kyiv timezone (DST-safe).
    - cron: "0 * * * *"
    # Telegram inline-button and message polling.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      run_scan:
        description: "Run a fresh vacancy scan"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: myshka-job-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: jobs/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r jobs/requirements.txt

      - name: Validate required Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          missing=()
          [[ -n "$TELEGRAM_BOT_TOKEN" ]] || missing+=("TELEGRAM_BOT_TOKEN")
          [[ -n "$TELEGRAM_CHAT_ID" ]] || missing+=("TELEGRAM_CHAT_ID")
          if (( ${#missing[@]} )); then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi
          echo "Required Telegram secrets are present (values are not displayed)."

      - name: Run scheduled vacancy scan
        if: >-
          (github.event_name == 'schedule' &&
          (github.event.schedule == '0 * * * *')) ||
          (github.event_name == 'workflow_dispatch' && inputs.run_scan) ||
          github.event_name == 'push'
        working-directory: jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MYSHKA_CANDIDATE_NAME: ${{ secrets.MYSHKA_CANDIDATE_NAME }}
          MYSHKA_PORTFOLIO_URL: ${{ secrets.MYSHKA_PORTFOLIO_URL }}
          MYSHKA_PORTFOLIO_3D_URL: ${{ secrets.MYSHKA_PORTFOLIO_3D_URL }}
          MYSHKA_PORTFOLIO_GAME_ART_URL: ${{ secrets.MYSHKA_PORTFOLIO_GAME_ART_URL }}
          MYSHKA_PORTFOLIO_DESIGN_URL: ${{ secrets.MYSHKA_PORTFOLIO_DESIGN_URL }}
          MYSHKA_PORTFOLIO_ILLUSTRATION_URL: ${{ secrets.MYSHKA_PORTFOLIO_ILLUSTRATION_URL }}
          MYSHKA_CV_URL: ${{ secrets.MYSHKA_CV_URL }}
          MYSHKA_CONTACT_EMAIL: ${{ secrets.MYSHKA_CONTACT_EMAIL }}
          MYSHKA_SALARY_EXPECTATION: ${{ secrets.MYSHKA_SALARY_EXPECTATION }}
          MYSHKA_FORCE_SCAN: ${{ github.event_name == 'push' || inputs.run_scan }}
        run: python run_scheduled_scan.py

      - name: Process Telegram buttons and messages
        working-directory: jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MYSHKA_CANDIDATE_NAME: ${{ secrets.MYSHKA_CANDIDATE_NAME }}
          MYSHKA_PORTFOLIO_URL: ${{ secrets.MYSHKA_PORTFOLIO_URL }}
          MYSHKA_PORTFOLIO_3D_URL: ${{ secrets.MYSHKA_PORTFOLIO_3D_URL }}
          MYSHKA_PORTFOLIO_GAME_ART_URL: ${{ secrets.MYSHKA_PORTFOLIO_GAME_ART_URL }}
          MYSHKA_PORTFOLIO_DESIGN_URL: ${{ secrets.MYSHKA_PORTFOLIO_DESIGN_URL }}
          MYSHKA_PORTFOLIO_ILLUSTRATION_URL: ${{ secrets.MYSHKA_PORTFOLIO_ILLUSTRATION_URL }}
          MYSHKA_CV_URL: ${{ secrets.MYSHKA_CV_URL }}
          MYSHKA_CONTACT_EMAIL: ${{ secrets.MYSHKA_CONTACT_EMAIL }}
          MYSHKA_SALARY_EXPECTATION: ${{ secrets.MYSHKA_SALARY_EXPECTATION }}
        run: python callbacks.py

      - name: Save bot state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs/seen.json jobs/applications.json jobs/statuses.json jobs/update_offset.json jobs/editing.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist MYSHKA Job Radar state"
            git push
          fi
