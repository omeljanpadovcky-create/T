name: MYSHKA JOB RADAR

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/myshka-job-radar.yml"
      - "jobs/**"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      run_scan:
        description: "Run a fresh vacancy scan"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: myshka-job-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: jobs/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r jobs/requirements.txt

      - name: Run MYSHKA tests
        working-directory: jobs
        run: python -m unittest discover -s . -p 'test_*.py'

      - name: Validate required Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          missing=()
          [[ -n "$TELEGRAM_BOT_TOKEN" ]] || missing+=("TELEGRAM_BOT_TOKEN")
          [[ -n "$TELEGRAM_CHAT_ID" ]] || missing+=("TELEGRAM_CHAT_ID")
          if (( ${#missing[@]} )); then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi
          echo "Required Telegram secrets are present (values are not displayed)."

      - name: Run vacancy scan
        if: >-
          (github.event_name == 'push') ||
          (github.event_name == 'schedule') ||
          (github.event_name == 'workflow_dispatch' && inputs.run_scan)
        working-directory: jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APINEX_API_KEY: ${{ secrets.APINEX_API_KEY }}
          APINEX_MODEL: free/deepseek-v4.1-flash
        run: python run_scheduled_scan.py

      - name: Save deduplication state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs/seen.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist MYSHKA vacancy deduplication state"
            git push
          fi
