name: P2P endpoint discovery
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/p2p-endpoint-discovery.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - name: Discover endpoint strings
        run: |
          python - <<'PY'
          import requests,re,html
          S=requests.Session();S.headers['User-Agent']='Mozilla/5.0'
          pages={
            "bingx":"https://fiat.bingx.com/en/p2p",
            "lbank":"https://www.lbank.com/uk/crypto/buy",
            "toobit":"https://www.toobit.com/en-US/p2p",
            "bitunix":"https://www.bitunix.com/p2p/p2p-trade",
            "weex":"https://www.weex.com/buy-crypto/trading",
          }
          pats=[
            r'https?://[^"\'<> ]{0,220}',
            r'["\']([^"\']{0,180}(?:p2p|otc|advert|merchant|fiat)[^"\']{0,180})["\']'
          ]
          for name,url in pages.items():
            print("\n=====",name,"=====")
            t=html.unescape(S.get(url,timeout=25).text)
            vals=set()
            for pat in pats:
              for m in re.finditer(pat,t,re.I):
                v=m.group(1) if m.lastindex else m.group(0)
                lv=v.lower()
                if any(k in lv for k in ['api','p2p','otc','advert','merchant','fiat']):
                  if len(v)<350: vals.add(v)
            for v in sorted(vals)[:250]: print(v)
          print("\n===== htx45 =====")
          for side in ['sell','buy']:
            u='https://www.htx.com/-/x/otc/v1/data/trade-market'
            p={'coinId':'2','currency':'45','tradeType':side,'currPage':'1','payMethod':'0','acceptOrder':'-1','country':'','blockType':'general','online':'1','range':'0','amount':'','onlyTradable':'false','isFollowed':'false'}
            r=S.get(u,params=p,timeout=20);print(side,r.status_code,r.text[:5000])
          print("\n===== bingx-old =====")
          for typ in ['1','2']:
            u='https://bingx.paycat.com/en-us/trade/self-selection'
            r=S.get(u,params={'fiat':'UAH','type':typ},timeout=20);print(typ,r.status_code,r.url,len(r.text),r.text[:1000])
          PY
